[package]
name = "Password_Manager"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
rpassword = "7.0"
argon2 = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "2.0.11"
zeroize = "1.8.1"
